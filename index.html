<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TYSON 3D</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="lib/three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\\/script>');
    }
  </script>
</head>
<body>
  <!-- T5S Project Background Splash (2 seconds) -->
  <div id="t5s-splash"></div>

  <!-- 3D Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Controls & Prompt -->
  <div id="ui">
    <div id="prompt">Press <b>E</b> to Drive</div>
    <div id="controls">WASD / Arrows to Move &bull; Space to Jump &bull; E to Drive Car</div>
  </div>

  <!-- TYSON Media Group Banner Logo (Bottom Right) -->
  <img id="tyson-banner" src="TYSONMediaGroupBanner.png" alt="TYSON Media Group">

  <!-- Project T6 Footer Logo (Very Bottom Center) -->
  <div style="position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 25; pointer-events: auto;">
    <a href="https://t6graph.tysonmediagroup.org" target="_blank" rel="noopener" title="PROJECT T6 // TYSON Media Group">
      <img src="assets/projectT6-logo.png" alt="PROJECT T6" style="height: 22px; width: auto; opacity: 0.85; filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3)); transition: all 0.3s ease;" onmouseover="this.style.opacity='1'; this.style.filter='drop-shadow(0 0 18px rgba(255, 255, 255, 0.6))';" onmouseout="this.style.opacity='0.85'; this.style.filter='drop-shadow(0 0 10px rgba(255, 255, 255, 0.3))';">
    </a>
  </div>

  <script src="game.js"></script>
</body>
</html>
